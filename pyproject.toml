[project]
name = "pineapple"
version = "0.1.0"
description = "A sweet and tart resume generator: Markdown to an ATS-friendly PDF resume."
requires-python = ">=3.15"
dependencies = ["reportlab>=5.0.1"]

[tool.uv]
# Supply-chain cooldown: only resolve releases at least 7 days old.
exclude-newer = "7 days"
# Cooldown exception (factory 2026-10-22): keep pillow 13.0.0 (published 2026-10-16), the fix for
# 28 Semgrep SCA advisories in pillow <13 (e.g. GHSA-332p-7hrc-92wf, GHSA-w889-685w-c8fh,
# GHSA-8g5g-8vmr-9782). Capped so later releases still wait. Remove once 13.0.0 is 7 days old (2026-10-23).
exclude-newer-package = { pillow = "2026-10-17T00:00:00Z" }
